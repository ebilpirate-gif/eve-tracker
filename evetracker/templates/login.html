{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Password <input type="password" name="password" autofocus required></label>
    <button>Log in</button>
  </form>
</section>
{% endblock %}
